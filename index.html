<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 750px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        h1 { text-align: center; color: #333; font-size: 35px; margin-bottom: 10px; }
        h3 { text-align: center; color: #667eea; margin-bottom: 15px; }

        p { color: #666; text-align: center; margin-bottom: 20px; font-size: 15px; }

        textarea {
            width: 100%;
            height: 220px;
            padding: 18px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            resize: vertical;
            outline: none;
            font-family: inherit;
            transition: 0.3s;
        }

        textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102,126,234,0.2);
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102,126,234,0.4);
        }

        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .summary-output {
            margin-top: 30px;
            padding: 22px;
            background: #f5f6ff;
            border-left: 5px solid #667eea;
            border-radius: 12px;
            min-height: 100px;
        }

        .summary-output h3 { text-align: left; color: #444; margin-bottom: 15px; }

        #summary-text {
            text-align: left;
            line-height: 1.7;
            color: #555;
            margin-bottom: 0;
        }

        @media (max-width: 600px) {
            .container { padding: 25px 18px; }
            h1 { font-size: 27px; }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Text Summarizer</h1>
        <h3>Using HuggingFace Transformer</h3>
        <p>Write or paste your content below for quick summarization.</p>

        <form id="summarization-form">
            <textarea id="dialogue-input" placeholder="Enter your content here..." required></textarea>
            <button type="submit">Summarize</button>
        </form>

        <div class="summary-output">
            <h3 id="summary-heading">Content Summary</h3>
            <p id="summary-text"></p>
        </div>
    </div>

    <script>
        document.getElementById("summarization-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const dialogueInput = document.getElementById("dialogue-input");
            const summaryText = document.getElementById("summary-text");
            const submitButton = e.target.querySelector("button");

            const dialogue = dialogueInput.value.trim();
            if (!dialogue) {
                summaryText.textContent = "Please enter some text to summarize.";
                return;
            }

            summaryText.textContent = "Processing...";
            if (submitButton) submitButton.disabled = true;

            try {
                const response = await fetch("/summarize/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ dialogue }),
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const data = await response.json();
                summaryText.textContent = data.summary || "No summary returned.";
            } catch (err) {
                summaryText.textContent = `Error: ${err.message}`;
            } finally {
                if (submitButton) submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
